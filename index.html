<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="description"
    content="Gestor inteligente de pacientes diarios con soporte para Policlínico, Hospitalizados y Extras." />
  <title>MediDiario AI</title>

  <!-- PWA Icons Configuration -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="mask-icon" href="/masked-icon.svg" color="#3b82f6" />

  <!-- Polyfill para process y global para evitar errores en librerías (especialmente en producción) -->
  <script>
    window.global = window;
    window.process = { env: {} };
  </script>

  <!-- Google Identity Services & GAPI -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'monospace'],
          },
          spacing: {
            gutter: '0.75rem',
            panel: '1.25rem',
            section: '1.5rem'
          },
          borderRadius: {
            pill: '999px',
            card: '18px',
            panel: '24px',
            control: '14px'
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              300: '#7cc8fb',
              400: '#38adf8',
              500: '#0e91e9',
              600: '#0274c7',
              700: '#035ca1',
              800: '#074e85',
              900: '#0c426e',
              950: '#082a49',
            },
          },
          boxShadow: {
            'premium-sm': '0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.02)',
            'premium': '0 12px 20px -5px rgba(0,0,0,0.06), 0 5px 10px -2px rgba(0,0,0,0.02), inset 0 1px 0 rgba(255,255,255,0.1)',
            'premium-lg': '0 25px 35px -8px rgba(0,0,0,0.1), 0 12px 15px -5px rgba(0,0,0,0.03), inset 0 1px 1px rgba(255,255,255,0.15)',
            'premium-xl': '0 30px 60px -15px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.2)',
            'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.08), inset 0 0 0 1px rgba(255,255,255,0.15)',
            'glass-dark': '0 8px 32px 0 rgba(0, 0, 0, 0.4), inset 0 0 0 1px rgba(255,255,255,0.05)',
          },
          animation: {
            'fade-in': 'fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-down': 'slideDown 0.25s cubic-bezier(0.16, 1, 0.3, 1)',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'bounce-subtle': 'bounceSubtle 2s infinite ease-in-out',
            'shimmer': 'shimmer 2s infinite linear',
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            slideDown: {
              '0%': { transform: 'translateY(-12px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            slideUp: {
              '0%': { transform: 'translateY(24px)', opacity: '0' },
              '100%': { transform: 'translateY(0)', opacity: '1' },
            },
            bounceSubtle: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-3px)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.4s;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Shared Element Transitions */
    [style*="view-transition-name"] {
      view-transition-name: attr(style);
    }

    .glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dark .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 10px 35px 0 rgba(31, 38, 135, 0.06);
    }

    .dark .glass-card {
      background: rgba(30, 41, 59, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Hide scrollbar utilities */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom Scrollbar for panels */
    .custom-scrollbar::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.4);
      border-radius: 20px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(75, 85, 99, 0.4);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: rgba(59, 130, 246, 0.5);
    }

    .shimmer-bg {
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.4) 50%,
          rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
    }

    .dark .shimmer-bg {
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.08) 50%,
          rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
    }

    /* Mesh Gradient Background */
    .mesh-bg {
      background-color: #ffffff;
      background-image:
        radial-gradient(at 0% 0%, hsla(217, 33%, 95%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(217, 33%, 95%, 1) 0, transparent 50%);
    }

    .dark .mesh-bg {
      background-color: #020617;
      background-image:
        radial-gradient(at 0% 0%, hsla(222, 47%, 11%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(217, 91%, 60%, 0.1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(222, 47%, 11%, 1) 0, transparent 50%);
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "date-fns": "https://aistudiocdn.com/date-fns@^4.1.0",
    "date-fns/": "https://aistudiocdn.com/date-fns@^4.1.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "jspdf": "https://aistudiocdn.com/jspdf@^3.0.4",
    "vite": "https://aistudiocdn.com/vite@^7.2.4",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.1",
    "buffer": "https://aistudiocdn.com/buffer@^6.0.3",
    "zustand/": "https://aistudiocdn.com/zustand@^5.0.8/",
    "zustand": "https://aistudiocdn.com/zustand@^5.0.8",
    "vite-plugin-pwa": "https://aistudiocdn.com/vite-plugin-pwa@^1.1.0"
  }
}
</script>
</head>

<body
  class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 selection:bg-blue-500 selection:text-white">
  <div id="root" class="flex h-screen w-full items-center justify-center">
    <div class="flex flex-col items-center space-y-4">
      <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
      <p class="text-sm text-gray-500 font-medium animate-pulse">Cargando MediDiario...</p>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
