<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#3b82f6" />
  <meta name="description"
    content="Gestor inteligente de pacientes diarios con soporte para Policlínico, Hospitalizados y Extras." />
  <title>MediDiario AI</title>

  <!-- PWA Icons Configuration -->
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="mask-icon" href="/masked-icon.svg" color="#3b82f6" />

  <!-- Polyfill para process y global para evitar errores en librerías (especialmente en producción) -->
  <script>
    window.global = window;
    window.process = { env: {} };
  </script>

  <!-- Google Identity Services & GAPI -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              300: '#7cc8fb',
              400: '#38adf8',
              500: '#0e91e9',
              600: '#0274c7',
              700: '#035ca1',
              800: '#074e85',
              900: '#0c426e',
              950: '#082a49',
            },
          },
        }
      }
    }
  </script>

  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://lh3.googleusercontent.com https://www.svgrepo.com https://iili.io; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://*.firebasestorage.app; frame-src 'self' https://accounts.google.com https://medidiario-9a2b4.firebaseapp.com;">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.4s;
      animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Shared Element Transitions */
    [style*="view-transition-name"] {
      view-transition-name: attr(style);
    }

    .glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .dark .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(24px) saturate(170%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 10px 35px 0 rgba(31, 38, 135, 0.06);
    }

    .dark .glass-card {
      background: rgba(30, 41, 59, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Hide scrollbar utilities */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom Scrollbar for panels */
    .custom-scrollbar::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(156, 163, 175, 0.4);
      border-radius: 20px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }

    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: rgba(75, 85, 99, 0.4);
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background-color: rgba(59, 130, 246, 0.5);
    }

    .shimmer-bg {
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.4) 50%,
          rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
    }

    .dark .shimmer-bg {
      background: linear-gradient(90deg,
          rgba(255, 255, 255, 0) 0%,
          rgba(255, 255, 255, 0.08) 50%,
          rgba(255, 255, 255, 0) 100%);
      background-size: 200% 100%;
    }

    /* Mesh Gradient Background */
    .mesh-bg {
      background-color: #ffffff;
      background-image:
        radial-gradient(at 0% 0%, hsla(217, 33%, 95%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(210, 100%, 96%, 1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(217, 33%, 95%, 1) 0, transparent 50%);
    }

    .dark .mesh-bg {
      background-color: #020617;
      background-image:
        radial-gradient(at 0% 0%, hsla(222, 47%, 11%, 1) 0, transparent 50%),
        radial-gradient(at 50% 0%, hsla(217, 91%, 60%, 0.1) 0, transparent 50%),
        radial-gradient(at 100% 0%, hsla(222, 47%, 11%, 1) 0, transparent 50%);
    }
  </style>
</head>

<body
  class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 transition-colors duration-300 selection:bg-blue-500 selection:text-white">
  <div id="root" class="flex h-screen w-full items-center justify-center">
    <div class="flex flex-col items-center space-y-4">
      <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
      <p class="text-sm text-gray-500 font-medium animate-pulse">Cargando MediDiario...</p>
    </div>
  </div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
